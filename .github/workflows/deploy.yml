name: Deploy RSS Combiner

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force deployment even if no changes detected"
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip on the canonical template repo (no CF token). Forks and “Use this template” repos run normally.
    if: github.repository != 'jaredcat/rss-combiner'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Ensure KV namespace for /admin (patch wrangler.toml in CI)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run ensure-kv-ci

      - name: List existing R2 buckets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: r2 bucket list
        id: list_buckets

      - name: Create R2 bucket if needed
        run: |
          BUCKET_NAME=$(grep 'bucket_name' wrangler.toml | head -1 | cut -d'"' -f2)
          echo "Required bucket: $BUCKET_NAME"

          if echo "${{ steps.list_buckets.outputs.command-output }}" | grep -q "$BUCKET_NAME"; then
            echo "✅ Bucket '$BUCKET_NAME' already exists"
          else
            echo "📦 Will create bucket '$BUCKET_NAME'..."
            echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
          fi

      - name: Create bucket with wrangler
        if: env.BUCKET_NAME != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: r2 bucket create ${{ env.BUCKET_NAME }}
        continue-on-error: true

      - name: Upload cover image if exists
        run: |
          if [ -f "cover.jpg" ] || [ -f "cover.jpeg" ] || [ -f "cover.png" ]; then
            echo "Found cover image, uploading to R2..."
            bun run upload-cover || echo "Cover upload failed, continuing deployment"
          else
            echo "No cover image found, skipping upload"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: deploy
        id: deploy

      - name: Sync ADMIN_SECRET to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          if [ -z "$ADMIN_SECRET" ]; then
            echo "::notice title=Admin password::Add repository secret ADMIN_SECRET (password for https://…/admin). Without it, /admin stays disabled until you set the secret."
          else
            printf '%s' "$ADMIN_SECRET" | bunx wrangler secret put ADMIN_SECRET
          fi

      - name: Deployment summary
        run: |
          if [ -n "${{ steps.deploy.outputs.deployment-url }}" ]; then
            WORKER_URL="${{ steps.deploy.outputs.deployment-url }}"
          else
            WORKER_NAME=$(grep '^name' wrangler.toml | head -1 | cut -d'"' -f2)
            WORKER_URL="https://${WORKER_NAME}.workers.dev"
          fi
          BUCKET_NAME=$(grep 'bucket_name' wrangler.toml | head -1 | cut -d'"' -f2)
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Deploy finished"
          echo "  Worker:     $WORKER_URL"
          echo "  Feed XML:   $WORKER_URL/podcasts.xml"
          echo "  Admin UI:   $WORKER_URL/admin"
          echo "  Health:     $WORKER_URL/healthcheck"
          echo ""
          echo "  Next: open /admin, add your podcast RSS URLs, then save."
          echo "  Enable R2 cover upload in wrangler.toml: set R2_PUBLIC_BASE_URL = https://${BUCKET_NAME}.r2.dev (no trailing slash)."
          echo "  Combined feed updates on save (or hourly cron). POST $WORKER_URL/deploy-trigger forces a rebuild."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
