name: Validate Configuration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    # Same as deploy: skip on the canonical template source repo (no need to validate the template copy).
    if: github.repository != 'jaredcat/rss-combiner'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Validate configuration (setup script)
        run: bun run setup

      - name: Check for common issues
        run: |
          echo "Checking wrangler.toml..."

          if grep -q "example.com" wrangler.toml; then
            echo "Error: Found example.com URLs in wrangler.toml — replace with real RSS feed URLs."
            exit 1
          fi

          if grep -q "your-podcast-feed-generator" wrangler.toml; then
            echo "Warning: Worker name is still the template default — change 'name' in wrangler.toml to something globally unique."
          fi

          if grep -q "your-podcasts-xml" wrangler.toml; then
            echo "Warning: R2 bucket name is still the template default — change bucket_name to something unique."
          fi

          if grep -q 'id = "00000000000000000000000000000000"' wrangler.toml; then
            echo "Note: KV id is still the placeholder — GitHub Actions will create the namespace on deploy. For local wrangler dev, create a KV namespace and paste its id, or deploy once and copy the id from the workflow log."
          fi

          if ! grep -q '\[\[queues.producers\]\]' wrangler.toml || ! grep -q '\[\[queues.consumers\]\]' wrangler.toml; then
            echo "Error: wrangler.toml is missing Queues producer/consumer bindings for rebuilds."
            exit 1
          fi

          echo "Validation finished."
