<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Interface</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        h1 { color: #333; }
        .container { max-width: 600px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        label { margin-bottom: 5px; display: block; }
        input[type="password"], input[type="text"] { width: 100%; padding: 10px; }
        button { padding: 10px 15px; background-color: #007BFF; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Podcast Feed Management</h1>
        <form id="adminForm">
            <div class="form-group">
                <label for="password">Enter Password:</label>
                <input type="password" id="password" required>
            </div>
            <div class="form-group">
                <label for="feedUrl">Feed URL:</label>
                <input type="text" id="feedUrl" placeholder="Enter podcast feed URL" required>
            </div>
            <button type="submit">Add Feed</button>
        </form>
    </div>
    <script>
        document.getElementById('adminForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent form submission for now
            const password = document.getElementById('password').value;
            // Add password validation and feed URL processing logic here
            alert('Password: ' + password + '\nFeed URL: ' + document.getElementById('feedUrl').value);
        });
    </script>
</body>
</html>
