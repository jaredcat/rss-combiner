name = "your-podcast-feed-generator"  # TODO: Change this to your unique worker name
main = "src/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = []

[[r2_buckets]]
binding = "XML_BUCKET"
bucket_name = "your-podcasts-xml"  # TODO: Change this to your unique bucket name

# KV stores admin-editable feed config (title, image, feeds, cover mode).
# GitHub Actions creates the namespace and patches this id on each deploy while it stays the placeholder.
# For local dev only: wrangler kv namespace create rss-combiner-kv-<worker-name> — or copy the id from CI logs after first deploy.
[[kv_namespaces]]
binding = "CONFIG_KV"
id = "00000000000000000000000000000000"  # Replaced automatically in CI, or paste a real id for local wrangler dev

# Sequential rebuild: one queue message ≈ one source feed, then finalize → podcasts.xml.
# CI creates the queue and syncs the name from `name` above (rss-combiner-rebuild-<worker-name>).
# Queues require Workers Paid to enable (free ops allotment after that). See docs/github-actions-setup.md.
[[queues.producers]]
binding = "REBUILD_QUEUE"
queue = "rss-combiner-rebuild-your-podcast-feed-generator"

[[queues.consumers]]
queue = "rss-combiner-rebuild-your-podcast-feed-generator"
max_batch_size = 1
max_retries = 5
retry_delay = 60

[triggers]
crons = ["0 */1 * * *"]  # Updates every hour - adjust as needed

[observability.logs]
enabled = true

[vars]
# Feed metadata - customize these for your combined feed
FEED_TITLE = "Chronological podcast mix (demo)"  # TODO: Customize your feed title
FEED_IMAGE_URL = "https://your-podcasts-xml.r2.dev/cover.jpg"  # TODO: Upload with 'bun run upload-cover' or use external URL
# Match your bucket name (same as bucket_name above). Enables “Upload to R2” in /admin and correct cover URLs:
# R2_PUBLIC_BASE_URL = "https://your-podcasts-xml.r2.dev"
# PUBLIC_BASE_URL = "https://your-worker.workers.dev"  # Optional: RSS feed_url / site_url (see README)

# Default cutoff (day / month / year): episodes must be published after this date unless a feed row overrides.
# Same vars as main; feeds with an older per-feed cutoff year get year-shifted (see admin UI -> Source feeds).
DEFAULT_CUTOFF_DATE_DAY = "20"
DEFAULT_CUTOFF_DATE_MONTH = "7"
DEFAULT_CUTOFF_DATE_YEAR = "2024"
FEED_INDEX_PADDING = "2"

# Demo defaults: six public feeds with varied cutoff years + merge timeline on every row so a fresh
# deploy shows year-shifting without editing JSON. Swap for your podcasts.
# Format: FEED_XX_URL (contiguous 01, 02, ...). Optional per feed: CUTOFF_* , MERGE_TIMELINE.

# Oh No, Ross and Carrie — long back catalog; older cutoff + year-shift mixes eras with other shows
# instead of dumping years of backlog before newer podcasts.
FEED_01_URL = "https://feeds.feedburner.com/OhNoPodcast"
FEED_01_CUTOFF_YEAR = "2013"
FEED_01_MERGE_TIMELINE = "true"

FEED_02_URL = "https://feeds.npr.org/510289/podcast.xml"
FEED_02_CUTOFF_YEAR = "2022"
FEED_02_MERGE_TIMELINE = "true"

FEED_03_URL = "https://rss.art19.com/factually--with-adam-conover"
FEED_03_CUTOFF_YEAR = "2023"
FEED_03_MERGE_TIMELINE = "true"

FEED_04_URL = "https://feeds.megaphone.fm/darknetdiaries"
FEED_04_CUTOFF_YEAR = "2019"
FEED_04_MERGE_TIMELINE = "true"

FEED_05_URL = "https://rss.art19.com/the-climate-deniers-playbook"
FEED_05_CUTOFF_YEAR = "2023"
FEED_05_MERGE_TIMELINE = "true"

FEED_06_URL = "https://feeds.simplecast.com/y1LF_sn2"
FEED_06_CUTOFF_YEAR = "2023"
FEED_06_MERGE_TIMELINE = "true"

# Additional options per feed:
# FEED_XX_CUTOFF_MONTH / FEED_XX_CUTOFF_DAY — optional, with CUTOFF_YEAR
# FEED_XX_MERGE_TIMELINE = "true" — same as admin “Merge this feed’s timeline”

# You can add up to 99 feeds (FEED_01 through FEED_99)
